name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :shared:testDebugUnitTest --stacktrace
      - run: ./gradlew :app:assembleDebug --stacktrace

  ios:
    name: iOS build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Cache Kotlin/Native (konan)
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-
      # No `shared/src/iosTest` sources yet, so this is a NO-SOURCE no-op today.
      # Kept so the first Kotlin/Native test that lands is run by CI.
      - name: Shared iOS unit tests (simulator target)
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace
      - name: Install XcodeGen
        run: brew install xcodegen
      # Signing.xcconfig is per-developer and gitignored; xcodegen validates
      # the path, and the simulator build runs with CODE_SIGNING_ALLOWED=NO,
      # so the committed placeholder template works as-is on CI.
      - name: Provide placeholder signing config
        working-directory: iosApp
        run: cp Configuration/Signing.xcconfig.template Configuration/Signing.xcconfig
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate
      # ARCHS=arm64: the generic destination would also build x86_64, and :shared
      # declares no iosX64 target (syncComposeResourcesForIos then fails with
      # "provider has no value"). The runners are Apple Silicon anyway.
      - name: Build iosApp for simulator
        working-directory: iosApp
        run: |
          xcodebuild -project iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build
      # Drives the app on a booted simulator (picks a photo, changes curve and
      # sliders, freezes, shares) and writes PNGs to /tmp/shots. ~35 s locally.
      # The picker needs something in the photo library, and the runner's
      # newest iPhone varies with the image, so resolve it instead of naming it.
      - name: UI test (screenshot run)
        run: |
          DEVICE=$(xcrun simctl list devices available | sed -nE 's/^ +(iPhone [^(]*[^ (]) \(.*/\1/p' | tail -1)
          echo "Using $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          sips -s format jpeg app/src/main/play/listings/en-GB/graphics/phone-screenshots/1-moore.png --out /tmp/photo.jpg
          xcrun simctl addmedia booted /tmp/photo.jpg
          cd iosApp
          xcodebuild test -project iosApp.xcodeproj -scheme iosApp \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO -only-testing:iosAppUITests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: /tmp/shots/*.png
          if-no-files-found: ignore
