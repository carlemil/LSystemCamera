org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Bypass AGP 9 built-in Kotlin so com.android.library + kotlin-multiplatform can coexist
# until Compose Multiplatform supports the new com.android.kotlin.multiplatform.library plugin.
android.builtInKotlin=false
android.newDsl=false
# The iOS targets are declared but cannot be built on Windows.
kotlin.native.ignoreDisabledTargets=true
